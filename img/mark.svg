<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Five Millennia of Eclipses">
  <!-- Site mark: a bare seal border, nothing inside it — the smallest bankuang
       (page frame) on the site. Stroke, not fill, so the paper shows through.
       The dark rule is load-bearing, not a nicety: browser tab strips are dark
       on most systems and the zhupi vermilion sinks into them. -->
  <!-- Geometry is set by the tab strip, not by taste: the outer edge of the stroke
       runs 1…63 of the 64 box (≈97%), overshooting the companion atlas mark's ≈91%
       fill on purpose. A hollow outline carries less optical mass than a filled
       glyph, so matching fill fractions renders the smaller of the two icons.
       Keep the stroke centred: x/y = margin + stroke/2. -->
  <style>
    rect { fill: none; stroke: #B23A2E; stroke-width: 8; }
    @media (prefers-color-scheme: dark) { rect { stroke: #E4675A; } }
  </style>
  <rect x="5" y="5" width="54" height="54"/>
</svg>
